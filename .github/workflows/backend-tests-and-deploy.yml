name: Backend Tests & Render Deploy

# Runs the backend test suite on pushes that touch the backend, and only then
# triggers a Render deploy hook. Set the "RENDER_DEPLOY_HOOK_URL" repository
# secret (Settings -> Secrets and variables -> Actions) to enable the deploy.
# If the secret is absent, the deploy step is skipped so the workflow still
# passes (Render's blueprint auto-deploy may already handle pushes).

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests-and-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and do not cancel one mid-flight.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run test suite
        working-directory: backend
        env:
          PYTHONPATH: .
          # Force the zero-config SQLite test database (production Postgres stays on Render).
          DATABASE_URL: ""
        run: python -m pytest tests/ -q

  deploy:
    name: Deploy backend to Render
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "::warning title=Render deploy skipped::RENDER_DEPLOY_HOOK_URL secret is not set. Add it under Settings > Secrets and variables > Actions. Render's blueprint auto-deploy may already deploy on push."
            exit 0
          fi
          echo "Tests passed. Triggering Render deploy..."
          curl -fsS --retry 3 --retry-delay 5 "${RENDER_DEPLOY_HOOK_URL}" -o /dev/null -w "Render responded with HTTP %{http_code}\n"
          echo "Render deploy triggered."
