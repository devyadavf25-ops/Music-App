databases:
  - name: aura-music-db
    databaseName: aura_music
    user: aura_admin
    plan: free

services:
  - type: web
    name: aura-music-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: aura-music-db
          property: connectionString
