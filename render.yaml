databases:
  - name: aura-music-db
    databaseName: aura_music
    user: aura_admin
    plan: free
    region: oregon

services:
  # 1. Backend FastAPI Service (Docker)
  - type: web
    name: aura-music-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: aura-music-db
          property: connectionString
      # --- Enable YouTube downloads on Render (datacenter IPs are blocked by YouTube) ---
      # Add ONE of these in the Render dashboard to let yt-dlp authenticate:
      #   YOUTUBE_COOKIES_FILE = /etc/secrets/cookies.txt   (upload a Netscape cookies.txt as a Secret File)
      #   YOUTUBE_COOKIES_B64  = <base64 of cookies.txt>
      #   YOUTUBE_PROXY        = http://user:pass@residential-proxy:port
      # Check readiness at: GET /api/v1/youtube/status
      # - key: YOUTUBE_COOKIES_FILE
      #   sync: false
      # - key: YOUTUBE_PROXY
      #   sync: false

  # 2. Web Prototype Companion (Static Site)
  - type: web
    name: aura-music-prototype
    runtime: static
    staticPublishPath: ./prototype
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
