databases:
  - name: aura-music-db
    databaseName: aura_music
    user: aura_admin
    plan: free
    region: oregon

services:
  # 1. Backend FastAPI Service (Docker)
  - type: web
    name: aura-music-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: aura-music-db
          property: connectionString

  # 2. Web Prototype Companion (Static Site)
  - type: static
    name: aura-music-prototype
    staticPublishPath: ./prototype
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
